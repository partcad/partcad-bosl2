# PartCAD package: BOSL2 exposed as parametric OpenSCAD parts.
#
# The parts are served by the `bosl2` repository plugin (bosl2_repo.py), which
# downloads BOSL2 on demand and generates a part per renderable module by
# parsing the module's signature. Each category below is a separate `external`
# sub-package backed by that one plugin, scoped by `subfolder`.
#
# The `name` is the package path this package expects to be published at inside
# partcad-index (side by side with cqwarehouse), so standalone development uses
# the very same addresses its consumers will.
name: //pub/std/metric/bosl2

# Requires the PartCAD version that introduced plugin-backed (external) packages
# and parametric OpenSCAD parts. Pinned to the current devel version so earlier
# releases do not attempt to load this package.
partcad: ">=0.7.146"

desc: |
  BOSL2 for PartCAD: the Belfry OpenSCAD Library v2 (https://github.com/BelfrySCAD/BOSL2/)
  exposed as parametric PartCAD parts. The BOSL2 source is fetched on demand and
  never vendored; parts are generated by parsing BOSL2 module signatures.
url: https://github.com/BelfrySCAD/BOSL2/

docs:
  name: BOSL2 for PartCAD
  intro: |
    This package publishes a broad, auto-generated catalog of BOSL2 modules as
    PartCAD `scad` parts. It stacks two PartCAD features: parts are driven
    through parameterized OpenSCAD `method` calls, and the whole catalog is
    served lazily by an `external` repository plugin rather than being
    enumerated in this file.

    BOSL2 itself is downloaded on demand (see the `ref` parameter of the
    `bosl2` repository below) into a local cache the first time a part is listed
    or built, so cloning this package stays lightweight.
  usage: |
    ```shell
    pc list parts -r //pub/std/metric/bosl2
    pc inspect //pub/std/metric/bosl2/shapes3d:cuboid
    pc inspect -p teeth=30 //pub/std/metric/bosl2/gears:spur_gear
    ```

dependencies:
  # Each BOSL2 source file becomes a sub-package. All are backed by the single
  # `bosl2` repository plugin, distinguished by `subfolder`.
  shapes3d:
    type: external
    plugin: :bosl2
    subfolder: shapes3d
    desc: 3D primitives (cuboid, cyl, prismoid, spheroid, tube, torus, ...)
  gears:
    type: external
    plugin: :bosl2
    subfolder: gears
    desc: Involute spur, ring, bevel and worm gears
  threading:
    type: external
    plugin: :bosl2
    subfolder: threading
    desc: Threaded rods and nuts (ISO, ACME, square, buttress, trapezoidal)
  screws:
    type: external
    plugin: :bosl2
    subfolder: screws
    desc: Standards-based screws and screw holes
  metric_screws:
    type: external
    plugin: :bosl2
    subfolder: metric_screws
    desc: Metric bolts, nuts and generic screws
  nema_steppers:
    type: external
    plugin: :bosl2
    subfolder: nema_steppers
    desc: NEMA stepper motor models
  ball_bearings:
    type: external
    plugin: :bosl2
    subfolder: ball_bearings
    desc: Trade-size ball bearings
  linear_bearings:
    type: external
    plugin: :bosl2
    subfolder: linear_bearings
    desc: Linear bearings and their housings
  joiners:
    type: external
    plugin: :bosl2
    subfolder: joiners
    desc: Snap-together joiners and pins
  cubetruss:
    type: external
    plugin: :bosl2
    subfolder: cubetruss
    desc: Modular cube-truss segments and clips
  bottlecaps:
    type: external
    plugin: :bosl2
    subfolder: bottlecaps
    desc: Bottle necks, caps and adapters
  walls:
    type: external
    plugin: :bosl2
    subfolder: walls
    desc: Lightweight, thinning and corrugated walls and struts

  # cqwarehouse imports the whole index here (onlyInRoot) so its parts can
  # `implements:` standard interfaces during standalone development. BOSL2's
  # auto-generated parts declare no interfaces, so this package does not need it
  # and omits it to keep standalone use lightweight (no index clone). Uncomment
  # if interface bindings are added later:
  #
  # pub:
  #   onlyInRoot: True
  #   type: git
  #   url: https://github.com/partcad/partcad-index/

repositories:
  bosl2:
    type: basic
    path: bosl2_repo.py
    desc: |
      Serves BOSL2 modules as parametric OpenSCAD parts, fetching the BOSL2
      source on demand.
    parameters:
      ref:
        type: string
        desc: The BOSL2 release tag to fetch and generate parts from.
        default: v2.0.747
